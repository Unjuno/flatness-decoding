experiment_name: sweep_n_gpt2
model_name: distilgpt2
device: auto
dtype: auto

sweep:
  methods: [random, minflat, maxflat]
  n_values: [1, 4, 8, 16]
  seeds: [0]

generation:
  max_new_tokens: 80
  proposal_temperature: 1.0

prompts:
  path: prompts/toy_prompts.jsonl
  limit: 5

output:
  generations_dir: outputs/generations/sweep_n_gpt2
  token_log_dir: outputs/token_logs/sweep_n_gpt2
