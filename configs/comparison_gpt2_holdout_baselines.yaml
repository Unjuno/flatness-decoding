experiment_name: comparison_gpt2_holdout_baselines
model_name: gpt2
model_cache_dir: models/hf
device: auto
dtype: auto
seeds: [1, 2]

generation:
  max_new_tokens: 120

prompts:
  path: prompts/writingprompts_holdout_20.jsonl
  limit: 20

baselines:
  methods: [greedy, beam, sampling, temperature, top_p, top_k]
  temperature: 1.2
  top_p: 0.9
  top_k: 50
  num_beams: 4

n_trial_methods:
  methods: []

runtime:
  inference_mode: true
  resume:
    skip_complete: true
  cleanup:
    device_cache_after_prompt: false
    device_cache_after_group: true
    python_gc_after_group: false

output:
  generations_dir: outputs/generations/comparison_gpt2_holdout_baselines
  token_log_dir: outputs/token_logs/comparison_gpt2_holdout_baselines
  summary_csv: results/summary/comparison_gpt2_holdout_baselines_metrics.csv
  table_csv: results/summary/comparison_gpt2_holdout_baselines_table.csv
  analysis_md: results/summary/comparison_gpt2_holdout_baselines_analysis.md
  figures_dir: results/figures/comparison_gpt2_holdout_baselines
