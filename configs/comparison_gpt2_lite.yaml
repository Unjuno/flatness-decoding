experiment_name: comparison_gpt2_lite
model_name: gpt2
model_cache_dir: models/hf
device: auto
dtype: auto
seeds: [0, 1]

generation:
  max_new_tokens: 120

prompts:
  path: prompts/main_prompts.jsonl
  limit: 40

baselines:
  methods: [greedy, beam, sampling, temperature, top_p, top_k]
  temperature: 1.2
  top_p: 0.9
  top_k: 50
  num_beams: 4

n_trial_methods:
  methods: [random, minflat, maxflat]
  n_values: [1, 4, 8, 16]
  proposal_temperature: 1.0
  use_kv_cache_lookahead: false
  candidate_eval_batch_size: 1

runtime:
  inference_mode: false
  resume:
    skip_complete: true
  cleanup:
    device_cache_after_prompt: false
    device_cache_after_group: true
    python_gc_after_group: false

output:
  generations_dir: outputs/generations/comparison_gpt2_lite
  token_log_dir: outputs/token_logs/comparison_gpt2_lite
  summary_csv: results/summary/comparison_gpt2_lite_metrics.csv
  table_csv: results/summary/comparison_gpt2_lite_table.csv
  figures_dir: results/figures/comparison_gpt2_lite
