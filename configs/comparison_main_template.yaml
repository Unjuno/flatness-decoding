experiment_name: comparison_gpt2_writingprompts
model_name: gpt2
model_cache_dir: models/hf
device: auto
dtype: auto
seeds: [0, 1, 2]

generation:
  max_new_tokens: 160

prompts:
  # Fixed narrative-generation prompt subset from euclaise/writingprompts.
  # The JSONL schema is: {"id": "...", "prompt": "...", "reference": "..."}
  path: prompts/writingprompts_fixed_100.jsonl
  limit: 100

baselines:
  # These are the standard baselines for the main comparison.
  # Do not treat this as exhaustive reproduction of every decoding paper.
  methods: [greedy, beam, sampling, temperature, top_p, top_k]
  temperature: 1.2
  top_p: 0.9
  top_k: 50
  num_beams: 4

n_trial_methods:
  # N sweep only applies to N-trial methods.
  methods: [random, minflat, maxflat, midflat, centerflat_q25, centerflat_q50, centerflat_q75, highprob_centerflat]
  n_values: [1, 4, 8, 16, 32]
  proposal_temperature: 1.0
  use_kv_cache_lookahead: false
  candidate_eval_batch_size: 1
  highprob_logprob_margin: 5.0
  highprob_rank_limit: 100

output:
  generations_dir: outputs/generations/comparison_gpt2_writingprompts
  token_log_dir: outputs/token_logs/comparison_gpt2_writingprompts
  summary_csv: results/summary/comparison_gpt2_writingprompts_metrics.csv
  table_csv: results/summary/comparison_gpt2_writingprompts_table.csv
  figures_dir: results/figures/comparison_gpt2_writingprompts
