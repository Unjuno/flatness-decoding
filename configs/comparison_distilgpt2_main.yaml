experiment_name: comparison_distilgpt2_main
model_name: distilgpt2
model_cache_dir: models/hf
device: auto
dtype: auto
seeds: [0, 1, 2]

generation:
  max_new_tokens: 120

prompts:
  path: prompts/main_prompts.jsonl
  limit: 100

baselines:
  methods: [greedy, beam, sampling, temperature, top_p, top_k]
  temperature: 1.2
  top_p: 0.9
  top_k: 50
  num_beams: 4

n_trial_methods:
  methods: [random, minflat, maxflat]
  n_values: [1, 4, 8, 16, 32]
  proposal_temperature: 1.0
  # Micro-batch candidate lookahead evaluation to reduce peak memory on MPS.
  # Increase to 2/4 only after confirming memory pressure stays low.
  candidate_eval_batch_size: 1

runtime:
  inference_mode: false
  resume:
    skip_complete: true
  cleanup:
    # Keep false by default to avoid per-prompt overhead; enable only if MPS
    # memory pressure still grows after KV-cache lookahead and micro-batching.
    device_cache_after_prompt: false
    # Safe hygiene point after each method/N/seed group file is written.
    device_cache_after_group: true
    python_gc_after_group: false

output:
  generations_dir: outputs/generations/comparison_distilgpt2_main
  token_log_dir: outputs/token_logs/comparison_distilgpt2_main
  summary_csv: results/summary/comparison_distilgpt2_main_metrics.csv
  table_csv: results/summary/comparison_distilgpt2_main_table.csv
  figures_dir: results/figures/comparison_distilgpt2_main
