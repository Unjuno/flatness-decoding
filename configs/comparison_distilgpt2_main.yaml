experiment_name: comparison_distilgpt2_writingprompts
model_name: distilgpt2
model_cache_dir: models/hf
device: auto
dtype: auto
seeds: [0, 1, 2]

generation:
  max_new_tokens: 120

prompts:
  path: prompts/writingprompts_fixed_100.jsonl
  limit: 100

baselines:
  methods: [greedy, beam, sampling, temperature, top_p, top_k]
  temperature: 1.2
  top_p: 0.9
  top_k: 50
  num_beams: 4

n_trial_methods:
  methods: [random, minflat, maxflat, midflat, centerflat_q25, centerflat_q50, centerflat_q75, highprob_centerflat]
  n_values: [1, 4, 8, 16, 32]
  proposal_temperature: 1.0
  # Official path: exact full-prefix candidate evaluation, micro-batched for memory.
  # KV-cache lookahead is disabled because it did not pass equivalence tests here.
  use_kv_cache_lookahead: false
  # Increase to 2 only after confirming memory pressure stays low on smoke.
  candidate_eval_batch_size: 1
  highprob_logprob_margin: 5.0
  highprob_rank_limit: 100

runtime:
  inference_mode: false
  resume:
    skip_complete: true
  cleanup:
    # Keep false by default to avoid per-prompt overhead; enable only if MPS
    # memory pressure still grows after full-prefix micro-batching.
    device_cache_after_prompt: false
    # Safe hygiene point after each method/N/seed group file is written.
    device_cache_after_group: true
    python_gc_after_group: false

output:
  generations_dir: outputs/generations/comparison_distilgpt2_writingprompts
  token_log_dir: outputs/token_logs/comparison_distilgpt2_writingprompts
  summary_csv: results/summary/comparison_distilgpt2_writingprompts_metrics.csv
  table_csv: results/summary/comparison_distilgpt2_writingprompts_table.csv
  figures_dir: results/figures/comparison_distilgpt2_writingprompts
