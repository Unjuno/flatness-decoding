[project]
name = "flatness-decoding"
version = "0.1.0"
description = "Experimental evaluation of next-state logit flatness as a decoding criterion."
requires-python = ">=3.10"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
src = ["src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Baseline ignores for the current research scripts. Tighten these gradually
# after the experiment/evaluation path is stable.
ignore = ["E501", "F401", "I001", "UP035"]
